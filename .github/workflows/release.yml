name: TapeOS Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build TapeOS Framework & Installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          # Bundle the Windows Installer into a standalone zip package
          zip -r "dist/TapeOS-Windows-Installer-${GITHUB_REF_NAME#v}.zip" installer/windows docs/WINDOWS_INSTALL_GUIDE.md README.md README.es.md LICENSE CHANGELOG.md tools/assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true

  build-windows-exe:
    name: Build Windows Installer EXE (self-contained)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build EXE with ps2exe
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          .\tools\build-exe.ps1 -Version "$($env:GITHUB_REF_NAME.TrimStart('v'))" -OutputDir dist

      - name: Sign EXE (if signing secrets are configured)
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:SIGNING_PFX_BASE64) {
            .\tools\sign-exe.ps1 -ExePath (Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1).FullName
          } else {
            Write-Host "No hay secretos de firma configurados: el EXE queda sin firmar."
          }

      - name: Upload EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            tools/assets/tapeos-signing.cer
