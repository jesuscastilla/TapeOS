name: Çoliçitû de Funçiôn / Feature Request
description: Çuhere una mehora, çoporte pa nuebo hardware u funçiôn pa er îttaladôh
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: ¡Keremô açêh TapeOS lo mâh kompatible poçible kon ekîpô de too tipo!
  - type: input
    id: title
    attributes:
      label: Reçûmen de la çuherençia
      placeholder: Çoporte pa drîber Wi-Fi RTL8821CE en kernel legacy, êtt.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Detaye de la propûêtta
      description: Êpplíka po ké çería útîh y kómo imahinâh çu funçionamiento.
    validations:
      required: true
