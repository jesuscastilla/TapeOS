name: 💡 Solicitud de Función / Feature Request
description: Sugiere una mejora, soporte para nuevo hardware o función para el instalador
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: ¡Queremos hacer TapeOS lo más compatible posible con equipos de todo tipo!
  - type: input
    id: title
    attributes:
      label: Resumen de la sugerencia
      placeholder: Soporte para driver Wi-Fi RTL8821CE en kernel legacy, etc.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Detalle de la propuesta
      description: Explica por qué sería útil y cómo imaginas su funcionamiento.
    validations:
      required: true
