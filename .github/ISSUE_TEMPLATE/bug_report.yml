name: Reporte de Fallo / Bug Report
description: Notifika un errôh u fallo en TapeOS u en er Îttaladôh Windows
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Graçiâh po tomâhte er tiempo de reportâh êtte problema. Açegúrate de inkluîh er log çi okurrió en er îttaladôh.
  - type: input
    id: hardware
    attributes:
      label: Modelo de Hardware / Dippoçitibo
      description: Ehemplo: Lenovo ThinkPad T430, Dell Inspiron 15, HP Pavilion g6, Intel NUC8
      placeholder: Marka, modelo êçâtto y CPU
    validations:
      required: true
  - type: dropdown
    id: boot_mode
    attributes:
      label: Modo de arrankê der PC
      options:
        - UEFI 64-bit (Moderno)
        - UEFI 32-bit (Atom Bay Trail / Cherry Trail)
        - BIOS Legacy / MBR (Çîn UEFI)
        - No êttoy çeguro
    validations:
      required: true
  - type: input
    id: recovery_used
    attributes:
      label: Imâhen de rekûperaçiôn ChromeOS utiliçá
      description: Ehemplo: rammus, voxel, jinlon, grunt, gumboz, kanix
      placeholder: rammus r107, voxel r120, êtt.
  - type: textarea
    id: description
    attributes:
      label: Dêkripçiôn der problema
      description: Êpplíka ké okurrió y lô paçô pa reproduçîh er fallo.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logh u kaptûrâ de pantaya
      description: Pega lâ çalíâ de la konçola u lô logh de TapeOS / Windows Installer.
