# TapeOS Free - Menu de arranque (base abierta)
set timeout=10
set default=0

menuentry "1. TapeOS Free - modo normal" --class tapeos {
    linux /syslinux/vmlinuz.A init=/sbin/init rootwait cros_debug ro noresume loglevel=7 noinitrd console= cros_efi root=PARTUUID=__ROOTA_UUID__ i915.modeset=1 amdgpu.modeset=1
}

menuentry "2. TapeOS Free - Diagnostico verbose (ver mensajes)" --class tapeos {
    linux /syslinux/vmlinuz.A init=/sbin/init rootwait cros_debug ro noresume loglevel=7 noinitrd console=tty0 cros_efi root=PARTUUID=__ROOTA_UUID__ i915.modeset=1 amdgpu.modeset=1 ignore_loglevel
}

menuentry "3. TapeOS Free - Modo seguro (sin graficos)" --class tapeos {
    linux /syslinux/vmlinuz.A init=/sbin/init rootwait cros_debug ro noresume loglevel=7 noinitrd console=tty0 cros_efi root=PARTUUID=__ROOTA_UUID__ nomodeset i915.modeset=0 amdgpu.modeset=0
}

menuentry "4. Consola de comandos GRUB" --class settings {
    commandline
}

menuentry "5. Apagar el equipo" --class halt {
    halt
}