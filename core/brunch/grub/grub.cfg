# ===================================================================
# TapeOS - Menu de arranque (framework Brunch + parches TapeOS)
# Sin menu de configuracion de Brunch: las opciones se aplican ya
# con el instalador (options= fijas en cada entrada).
# ===================================================================
set timeout=10
set default=0
regexp --set disk "(^.+)(,gpt)" $root
source /efi/boot/theme.cfg

menuentry "1. TapeOS - modo normal" --class "brunch" {
linux ($disk,7)/kernel boot=local noresume noswap loglevel=7 cros_secure cros_debug options=__TAPEOOS_OPTIONS__ console= vt.global_cursor_default=0 quiet
initrd ($disk,7)/lib/firmware/amd-ucode.img ($disk,7)/lib/firmware/intel-ucode.img ($disk,7)/initramfs.img
}

menuentry "2. TapeOS - Diagnostico verbose (ver mensajes)" --class "brunch" {
linux ($disk,7)/kernel boot=local noresume noswap loglevel=7 cros_secure cros_debug options=__TAPEOOS_OPTIONS__ ignore_loglevel earlyprintk=efi,keep initcall_debug log_buf_len=2M noquiet
initrd ($disk,7)/lib/firmware/amd-ucode.img ($disk,7)/lib/firmware/intel-ucode.img ($disk,7)/initramfs.img
}

menuentry "3. TapeOS - Modo seguro (sin graficos)" --class "brunch" {
linux ($disk,7)/kernel boot=local noresume noswap loglevel=7 cros_secure cros_debug options=__TAPEOOS_OPTIONS__ nomodeset i915.modeset=0 amdgpu.modeset=0 ignore_loglevel noquiet
initrd ($disk,7)/lib/firmware/amd-ucode.img ($disk,7)/lib/firmware/intel-ucode.img ($disk,7)/initramfs.img
}

menuentry "4. Instalar TapeOS en un disco duro" --class "brunch" {
linux ($disk,7)/kernel boot=local noresume noswap loglevel=7 cros_secure cros_debug options=install_tapeos,verbose console=
initrd ($disk,7)/lib/firmware/amd-ucode.img ($disk,7)/lib/firmware/intel-ucode.img ($disk,7)/initramfs.img
}

menuentry "5. Consola de comandos GRUB" --class "brunch" {
commandline
}

menuentry "6. Apagar el equipo" --class "brunch" {
halt
}